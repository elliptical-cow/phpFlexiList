name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          tools: composer
      - run: composer validate --strict --no-check-lock
      - run: composer lint
      - run: composer test
      - run: composer test-http
      - run: php tools/verify_vendor.php

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
